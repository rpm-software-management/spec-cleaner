[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "spec_cleaner"
dynamic = ["version"]
requires-python = ">=3.11"

authors = [
    {name = "Kristyna Streitova", email = "kstreitova@suse.com"},
    {name = "Tomáš Chvátal", email="tchvatal@suse.com"},
]
description = "RPM .spec files cleaner"
readme = "README.md"
keywords = ["SUSE", "RPM", ".spec", "cleaner"]
license = "BSD-3-Clause"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: Unix",
    "Operating System :: POSIX",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
    "Topic :: Text Processing"
]

dependencies = [
    "python-rpm-spec"
]

[tool.setuptools]
packages = ["spec_cleaner"]
platforms = ["Linux"]

[tool.setuptools.package-data]
spec_cleaner = ["data/*"]

[tool.setuptools.data-files]
"lib/obs/service/" = ["obs/*"]
"share/spec-cleaner" = ["spec_cleaner/data/*"]

[project.scripts]
spec-cleaner = "spec_cleaner:main"

[project.urls]
Homepage = "https://github.com/rpm-software-management/spec-cleaner"
Repository = "https://github.com/rpm-software-management/spec-cleaner.git"
Issues = "https://github.com/rpm-software-management/spec-cleaner/issues"

[tool.setuptools.dynamic]
version = {attr = "spec_cleaner.__version__"}

[project.optional-dependencies]
tests = [
    "pytest",
    "pytest-cov",
    "pytest-xdist"
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "D",   # pydocstyle
    "N",   # pep8-naming
    "A",   # flake8-builtins
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "Q",   # flake8-quotes
    "UP",  # pyupgrade
]
ignore = [
    "E402",  # module-import-not-at-top
    "E501",  # line-too-long (handled by the formatter)
    "E502",  # backslash-redundant
    "D100",  # missing-docstring-in-public-module
    "D203",  # blank-line-before-class (incompatible with D211; D211 wins)
    "D212",  # multi-line-summary-first-line (the codebase puts the summary on the second line)
    "D401",  # non-imperative-mood
    "D413",  # blank-line-after-last-section
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N999"]  # test modules are deliberately named *-tests.py

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.ruff.format]
quote-style = "single"

