name: Python package

on:
  push:
    branches: 
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

# Cancel superseded pull request runs; each push to master gets a run of
# its own, so none is queued behind another or dropped.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Lint once, on the oldest supported Python, with the hook versions
  # that Dependabot keeps up to date in .pre-commit-config.yaml.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.11"
    - name: Install pre-commit
      run: |
        python -m pip install --upgrade pip pre-commit
    - name: Run the pre-commit hooks
      run: |
        pre-commit run --all-files --show-diff-on-failure
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade -r devel-requirements.pip
    - name: Test the package
      run: |
        python3 -m pytest
    - name: Collect the coveralls report
      uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        flag-name: python-${{ matrix.python-version }}
        parallel: true
      if: success()
  # Build the distributions a release would publish and check that the
  # wheel installs and cleans a spec with the data files it ships.
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        # the newest stable release, whichever that is
        python-version: "3.x"
    - name: Build the sdist and wheel
      run: |
        python -m pip install --upgrade pip build twine
        python -m build
        twine check --strict dist/*
    - name: Clean a spec with the installed wheel
      run: |
        python -m venv "$RUNNER_TEMP/venv"
        "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl
        "$RUNNER_TEMP/venv/bin/spec-cleaner" --pkgconfig --copyright-year 2013 \
          tests/in/brackety-package-names.spec | diff -u tests/out/brackety-package-names.spec -
  # Tell Coveralls the parallel uploads are done so it aggregates them;
  # without this the branch coverage never updates.
  finish:
    needs: test
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Coveralls finished
      uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        parallel-finished: true
        # Keep in sync with the python-version matrix above.
        carryforward: "python-3.11,python-3.12,python-3.13,python-3.14"
