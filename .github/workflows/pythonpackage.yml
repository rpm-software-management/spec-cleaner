name: Python package

on:
  push:
    branches: 
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade -r devel-requirements.pip
    - name: Test the package
      run: |
        python3 -m pytest
    - name: Validate ruff
      run: |
        ruff check .
        ruff format --check .
    - name: Validate statical typing
      run: |
        mypy spec_cleaner
    - name: Collect the coveralls report
      uses: coverallsapp/github-action@v2
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        flag-name: python-${{ matrix.python-version }}
        parallel: true
      if: success()
  # Tell Coveralls the parallel uploads are done so it aggregates them;
  # without this the branch coverage never updates.
  finish:
    needs: test
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
    - name: Coveralls finished
      uses: coverallsapp/github-action@v2
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        parallel-finished: true
        # Keep in sync with the python-version matrix above.
        carryforward: "python-3.11,python-3.12,python-3.13"
