name: Distro corpus sweep

# Stress-test spec-cleaner against all of openSUSE:Factory (Tumbleweed)
# and Fedora Rawhide specs.
# - Manual trigger: pre-release gate (workflow_dispatch)
# - Weekly schedule: catch regressions from distro spec evolution
# Tickets (label: corpus-sweep) are opened for crashes and non-idempotent
# results. Dedup is against all past corpus-sweep tickets (open and closed):
# a recurring failure after its ticket closed is a regression and gets a new
# ticket referencing the old one. Changed output alone is never ticketed.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 0'  # Sunday 02:00 UTC

permissions:
  contents: read
  issues: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        distro: [tumbleweed, rawhide]
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade -r devel-requirements.pip

    - name: Download Tumbleweed specs
      if: matrix.distro == 'tumbleweed'
      run: |
        python - <<'EOF'
        import os, sys, xml.etree.ElementTree as ET
        from concurrent.futures import ThreadPoolExecutor
        from urllib.parse import quote
        from urllib.request import urlopen

        BASE = 'https://api.opensuse.org/public/source/openSUSE:Factory'
        OUTDIR = 'corpus-specs'
        os.makedirs(OUTDIR, exist_ok=True)

        def fetch(url):
            try:
                with urlopen(url, timeout=30) as r:
                    return r.read()
            except Exception:
                return None

        # List all packages in Factory
        data = fetch(f'{BASE}')
        pkgs = []
        if data:
            root = ET.fromstring(data)
            pkgs = [e.get('name') for e in root.findall('entry')]

        print(f'Found {len(pkgs)} packages', flush=True)

        def download(pkg):
            out = os.path.join(OUTDIR, f'{pkg}.spec')
            if os.path.exists(out) and os.path.getsize(out) > 0:
                return 'cached'
            data = fetch(f'{BASE}/{quote(pkg)}/{quote(pkg)}.spec')
            if data:
                with open(out, 'wb') as f:
                    f.write(data)
                return 'ok'
            # Try listing the package dir for non-standard spec names
            listing = fetch(f'{BASE}/{quote(pkg)}')
            if listing:
                try:
                    root = ET.fromstring(listing)
                    for e in root.findall('entry'):
                        name = e.get('name', '')
                        if name.endswith('.spec'):
                            spec_data = fetch(f'{BASE}/{quote(pkg)}/{quote(name)}')
                            if spec_data:
                                safe = name.replace('/', '_')
                                with open(os.path.join(OUTDIR, f'{pkg}__{safe}'), 'wb') as f:
                                    f.write(spec_data)
                                return 'ok-multi'
                except Exception:
                    pass
            return 'missing'

        from collections import Counter
        with ThreadPoolExecutor(max_workers=16) as ex:
            results = Counter(ex.map(download, pkgs))
        print(dict(results), flush=True)

        # Fail fast: 0 specs means the download broke, not a clean corpus
        total = sum(v for k, v in results.items() if k in ('ok', 'ok-multi', 'cached'))
        if total == 0:
            print('ERROR: 0 specs downloaded, aborting', flush=True)
            sys.exit(1)
        print(f'Downloaded {total} specs', flush=True)
        EOF

    - name: Download Rawhide specs
      if: matrix.distro == 'rawhide'
      run: |
        python - <<'EOF'
        import json, os, sys
        from concurrent.futures import ThreadPoolExecutor
        from urllib.parse import quote
        from urllib.request import urlopen, Request

        OUTDIR = 'corpus-specs'
        os.makedirs(OUTDIR, exist_ok=True)

        def fetch_json(url):
            try:
                req = Request(url, headers={'Accept': 'application/json'})
                with urlopen(req, timeout=30) as r:
                    return json.loads(r.read())
            except Exception as e:
                print(f'fetch failed for {url}: {e}', flush=True)
                return None

        def fetch_raw(url):
            try:
                with urlopen(url, timeout=30) as r:
                    return r.read()
            except Exception:
                return None

        # Paginate through all rpms/* projects on src.fedoraproject.org
        pkgs = []
        page = 1
        while True:
            data = fetch_json(
                f'https://src.fedoraproject.org/api/0/projects'
                f'?namespace=rpms&per_page=100&page={page}&short=true')
            if not data or not data.get('projects'):
                break
            pkgs.extend(p['name'] for p in data['projects'])
            print(f'page {page}: {len(pkgs)} packages so far', flush=True)
            pagination = data.get('pagination', {})
            if page >= pagination.get('pages', page):
                break
            page += 1
            if page > 300:  # safety cap (~30k packages)
                break

        print(f'Found {len(pkgs)} packages', flush=True)
        if not pkgs:
            print('ERROR: 0 packages listed, aborting', flush=True)
            sys.exit(1)

        def download(pkg):
            out = os.path.join(OUTDIR, f'{pkg}.spec')
            if os.path.exists(out) and os.path.getsize(out) > 0:
                return 'cached'
            # Rawhide branch, 'f' folder = the spec file location
            data = fetch_raw(
                f'https://src.fedoraproject.org/rpms/{quote(pkg)}'
                f'/raw/rawhide/f/{quote(pkg)}.spec')
            if data:
                with open(out, 'wb') as f:
                    f.write(data)
                return 'ok'
            return 'missing'

        from collections import Counter
        with ThreadPoolExecutor(max_workers=16) as ex:
            results = Counter(ex.map(download, pkgs))
        print(dict(results), flush=True)

        total = sum(v for k, v in results.items() if k in ('ok', 'cached'))
        if total == 0:
            print('ERROR: 0 specs downloaded, aborting', flush=True)
            sys.exit(1)
        print(f'Downloaded {total} specs', flush=True)
        EOF

python - <<'EOF'
        import concurrent.futures as cf
        import json, os, sys, tempfile, traceback

        from spec_cleaner import RpmSpecCleaner
        from spec_cleaner import rpmpreamble

        # Disable network URL probes: deterministic, no CI stalls
        _orig = rpmpreamble.RpmPreamble._make_secure_url
        def _no_probe(self, orig_url, skip_availabilty_check=False, force_https=False):
            return _orig(self, orig_url, skip_availabilty_check=True, force_https=force_https)
        rpmpreamble.RpmPreamble._make_secure_url = _no_probe

        BASE_OPTS = {
            'pkgconfig': False, 'inline': False, 'diff': False,
            'diff_prog': 'vimdiff', 'minimal': False,
            'no_curlification': False, 'suse_copyright': False,
            'copyright_year': 2026, 'remove_groups': False,
            'tex': False, 'perl': False, 'cmake': False,
            'keep_space': False,
        }

        # texlive specs are generated, never touch them
        def skip(name):
            return name == 'texlive.spec' or name.startswith('texlive-')

        specs = sorted(f for f in os.listdir('corpus-specs')
                       if f.endswith('.spec') and not skip(f))
        print(f'Sweeping {len(specs)} specs', flush=True)
        if not specs:
            print('ERROR: 0 specs to sweep, aborting', flush=True)
            sys.exit(1)

        def run_clean(in_path):
            """Run spec-cleaner on a file, return cleaned lines."""
            with tempfile.NamedTemporaryFile(mode='w', suffix='.spec',
                                             delete=False) as tf:
                out_path = tf.name
            try:
                opts = dict(BASE_OPTS, specfile=in_path, output=out_path)
                RpmSpecCleaner(opts).run()
                with open(out_path, encoding='utf-8', errors='replace') as f:
                    return f.read().splitlines()
            finally:
                if os.path.exists(out_path):
                    os.unlink(out_path)

        def run_one(fname):
            path = os.path.join('corpus-specs', fname)
            try:
                with open(path, encoding='utf-8', errors='replace') as f:
                    orig = f.read().splitlines()
                out1 = run_clean(path)
                # idempotency: write pass1 to temp, run again, must be stable
                with tempfile.NamedTemporaryFile(mode='w', suffix='.spec',
                                                 delete=False) as tf:
                    tf.write('\n'.join(out1) + '\n')
                    tmp1 = tf.name
                try:
                    out2 = run_clean(tmp1)
                finally:
                    os.unlink(tmp1)
                return {'spec': fname, 'status': 'ok',
                        'changed': out1 != orig,
                        'non_idempotent': out1 != out2}
            except Exception:
                return {'spec': fname, 'status': 'error',
                        'traceback': traceback.format_exc()[-2000:]}

        results = []
        with cf.ThreadPoolExecutor(max_workers=4) as ex:
            for r in ex.map(run_one, specs):
                results.append(r)

        errors = [r for r in results if r['status'] == 'error']
        nonidem = [r for r in results if r.get('non_idempotent')]
        changed = [r for r in results if r.get('changed')]

        print(f'done: {len(results)} specs, {len(changed)} changed, '
              f'{len(errors)} errors, {len(nonidem)} non-idempotent', flush=True)

        with open('sweep-report.json', 'w') as f:
            json.dump({'errors': errors,
                       'non_idempotent': [r['spec'] for r in nonidem],
                       'total': len(results),
                       'changed': len(changed)}, f, indent=1)
        EOF

    - name: Upload sweep report
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.distro }}-sweep-report
        path: sweep-report.json
        retention-days: 90

    - name: Open tickets for new failures
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        DISTRO: ${{ matrix.distro }}
      run: |
        python - <<'EOF'
        import json, os, subprocess

        distro = os.environ['DISTRO']

        with open('sweep-report.json') as f:
            report = json.load(f)

        # Both crashes and non-idempotent results indicate bugs
        failures = []
        for e in report['errors']:
            failures.append({'spec': e['spec'], 'kind': 'crash',
                             'detail': e['traceback']})
        for spec in report['non_idempotent']:
            failures.append({'spec': spec, 'kind': 'non-idempotent',
                             'detail': 'Second spec-cleaner pass produced '
                                       'different output than the first.'})

        print(f'[{distro}] {len(failures)} failing specs '
              f'({len(report["errors"])} crashes, '
              f'{len(report["non_idempotent"])} non-idempotent)', flush=True)
        if not failures:
            print('No failures, nothing to ticket.')
            exit(0)

        # Dedup against ALL past corpus-sweep tickets (open and closed):
        # the ticket history is the baseline. A recurring failure after
        # its ticket was closed means a regression — ticket it again,
        # but reference the old ticket.
        existing = subprocess.run(
            ['gh', 'issue', 'list', '--label', 'corpus-sweep',
             '--state', 'all', '--json', 'title,number,state',
             '--limit', '500'],
            capture_output=True, text=True).stdout
        tickets = json.loads(existing) if existing.strip() else []
        # title format: "[corpus-sweep:distro] <spec> (<kind>)"
        seen = {}
        for t in tickets:
            title = t['title']
            prefix = f'[corpus-sweep:{distro}] '
            if title.startswith(prefix):
                rest = title[len(prefix):]
                # split off the trailing " (kind)"
                if rest.endswith(')'):
                    spec = rest[:rest.rfind(' (')]
                    seen[spec] = t

        opened = 0
        for f in failures[:20]:  # cap at 20 tickets per run to avoid spam
            spec, kind = f['spec'], f['kind']
            title = f'[corpus-sweep:{distro}] {spec} ({kind})'
            if spec in seen:
                old = seen[spec]
                if old['state'] == 'OPEN':
                    print(f'Skip {spec}: ticket #{old["number"]} already open',
                          flush=True)
                    continue
                # Regression: was fixed/closed, now failing again
                body = (
                    f'Regression: `{spec}` is failing again in the {distro} '
                    f'corpus sweep ({kind}).\n\nPreviously tracked in '
                    f'#{old["number"]} (now closed).\n\n'
                    f'```\n{f["detail"]}\n```'
                )
            else:
                body = (
                    f'spec-cleaner failed on `{spec}` from {distro} '
                    f'({kind}).\n\n```\n{f["detail"]}\n```\n\n'
                    f'Found by the distro corpus sweep. '
                    f'Please attach a minimal reproducer if possible.'
                )
            subprocess.run(
                ['gh', 'issue', 'create', '--title', title,
                 '--body', body, '--label', 'corpus-sweep'],
                check=True)
            print(f'Opened ticket for {spec} ({kind})', flush=True)
            opened += 1

        if len(failures) > 20:
            print(f'WARNING: {len(failures) - 20} more failures not ticketed (cap)',
                  flush=True)
        print(f'Opened {opened} new tickets', flush=True)
        EOF
