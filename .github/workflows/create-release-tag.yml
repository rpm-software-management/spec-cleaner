name: Create signed release tag

# Manually triggered release tagging. Imports the dedicated signing subkey
# from secrets, creates a signed tag for the version in
# spec_cleaner/__init__.py, pushes it, and starts the "Release to PyPI"
# workflow for it, which verifies the signature before publishing.
#
# Required secrets:
#   TCHVATAL_SUBKEY_EXP_SEP_27 - armored private signing subkey
#   TCHVATAL_SUBKEY_PASSPHRASE  - passphrase for the subkey

on:
  workflow_dispatch:

jobs:
  # release.yml checks this again, but failing here leaves no tag to delete.
  check-data:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify generated files are up to date
        run: |
          make
          if ! git diff --exit-code -- spec_cleaner/data/ README.md; then
            echo "::error::Generated files are stale. Run 'make', merge the result, and run this workflow again."
            exit 1
          fi

  tag:
    needs: check-data
    # Only release what is on master.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      # To start the release workflow for the new tag.
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Import signing subkey
        # Pure shell: gpg-agent on the runner occasionally fails to start,
        # making the passphrase preset fail with "Not found <GPG Agent>".
        # Retry the preset; the key import itself is idempotent.
        env:
          GPG_PRIVATE_KEY: ${{ secrets.TCHVATAL_SUBKEY_EXP_SEP_27 }}
          GPG_PASSPHRASE: ${{ secrets.TCHVATAL_SUBKEY_PASSPHRASE }}
        run: |
          set -u
          GNUPGHOME="$HOME/.gnupg"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          printf 'allow-preset-passphrase\nallow-loopback-pinentry\n' > "$GNUPGHOME/gpg-agent.conf"

          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import

          FPR="$(gpg --with-colons --list-secret-keys | awk -F: '/^fpr:/ {print $10; exit}')"
          KEYGRIP="$(gpg --with-keygrip --list-secret-keys "$FPR" | awk '/Keygrip/ {print $3; exit}')"
          HEX_PASS="$(printf '%s' "$GPG_PASSPHRASE" | od -A n -t x1 | tr -d ' \n')"

          for attempt in 1 2 3; do
            if printf 'PRESET_PASSPHRASE %s -1 %s\n' "$KEYGRIP" "$HEX_PASS" | gpg-connect-agent; then
              break
            fi
            echo "Passphrase preset failed (attempt $attempt), restarting agent..."
            gpg-connect-agent KILLAGENT /bye 2>/dev/null || true
            sleep 5
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Failed to preset GPG passphrase after 3 attempts."
              exit 1
            fi
          done

          printf '%s:6:\n' "$FPR" | gpg --batch --import-ownertrust
          git config --global user.name "Tomáš Chvátal"
          git config --global user.email "tomas.chvatal@gmail.com"
          git config --global user.signingkey "$FPR"
          git config --global tag.gpgsign true
      - name: Create and push signed tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PKG_VERSION="$(python3 -c "import re,pathlib; print(re.search(r'__version__ = .([^\x27\"]+).', pathlib.Path('spec_cleaner/__init__.py').read_text()).group(1))")"
          TAG="spec-cleaner-${PKG_VERSION}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::Tag ${TAG} already exists. Bump __version__ first."
            exit 1
          fi
          git tag -s "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}"
          echo "Pushed signed tag ${TAG}."
          gh workflow run release.yml --ref "${TAG}"
          echo "Started the release workflow for ${TAG}."
