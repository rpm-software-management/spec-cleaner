name: Release to PyPI

# Triggered by the maintainer pushing a signed tag, e.g.:
#   git tag -s spec-cleaner-1.2.5
#   git push origin spec-cleaner-1.2.5

on:
  push:
    tags:
      - "spec-cleaner-*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # OIDC token for PyPI Trusted Publishing.
      id-token: write
      # Needed to create the GitHub Release.
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#spec-cleaner-}"
          PKG_VERSION="$(python -c 'import spec_cleaner; print(spec_cleaner.__version__)')"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version '$TAG_VERSION' does not match spec_cleaner.__version__ '$PKG_VERSION'."
            exit 1
          fi
          echo "Version $TAG_VERSION confirmed."
      - name: Verify generated data are up to date
        run: |
          make
          if ! git diff --exit-code -- spec_cleaner/data/; then
            echo "::error::Generated data are stale. Run 'make', commit the result, and re-tag."
            exit 1
          fi
      - name: Build package
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
