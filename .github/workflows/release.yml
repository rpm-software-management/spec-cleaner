name: Release to PyPI

# Triggered by the maintainer pushing a signed tag, e.g.:
#   git tag -s spec-cleaner-1.2.5
#   git push origin spec-cleaner-1.2.5
#
# The tag signature is verified below before anything is published.

on:
  push:
    tags:
      - "spec-cleaner-*"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade -r devel-requirements.pip
      - name: Test the package
        run: |
          python3 -m pytest

  release:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # OIDC token for PyPI Trusted Publishing.
      id-token: write
      # Needed to create the GitHub Release.
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify tag signature
        run: |
          git verify-tag "${GITHUB_REF_NAME}"
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#spec-cleaner-}"
          PKG_VERSION="$(python -c "import re,pathlib; print(re.search(r'__version__ = .([^\x27\"]+).', pathlib.Path('spec_cleaner/__init__.py').read_text()).group(1))")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version '$TAG_VERSION' does not match spec_cleaner.__version__ '$PKG_VERSION'."
            exit 1
          fi
          echo "Version $TAG_VERSION confirmed."
      - name: Verify generated files are up to date
        run: |
          make
          if ! git diff --exit-code -- spec_cleaner/data/ README.md; then
            echo "::error::Generated files are stale. Run 'make', commit the result, and re-tag."
            exit 1
          fi
      - name: Build package
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
