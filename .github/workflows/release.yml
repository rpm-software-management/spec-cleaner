name: Release to PyPI

# Started by the "Create signed release tag" workflow, or by a maintainer
# pushing a signed tag, e.g.:
#   git tag -s spec-cleaner-1.2.5
#   git push origin spec-cleaner-1.2.5
#
# The tag signature is verified below before anything is published.

on:
  push:
    tags:
      - "spec-cleaner-*"
  # A tag pushed by a workflow with GITHUB_TOKEN triggers nothing, so
  # create-release-tag.yml starts this run for the tag explicitly.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade -r devel-requirements.pip
      - name: Test the package
        run: |
          python3 -m pytest

  # The checks and the build run here with read-only access; the jobs
  # below only publish what it built.
  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Import the release signing key
        # The public half of the key create-release-tag.yml signs with.
        run: |
          curl -fsSL https://github.com/scarabeusiv.gpg | gpg --batch --import
      - name: Verify tag signature
        run: |
          git verify-tag "${GITHUB_REF_NAME}"
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#spec-cleaner-}"
          PKG_VERSION="$(python -c "import re,pathlib; print(re.search(r'__version__ = .([^\x27\"]+).', pathlib.Path('spec_cleaner/__init__.py').read_text()).group(1))")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version '$TAG_VERSION' does not match spec_cleaner.__version__ '$PKG_VERSION'."
            exit 1
          fi
          echo "Version $TAG_VERSION confirmed."
      - name: Verify generated files are up to date
        run: |
          make
          if ! git diff --exit-code -- spec_cleaner/data/ README.md; then
            echo "::error::Generated files are stale. Run 'make', commit the result, and re-tag."
            exit 1
          fi
      - name: Build package
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/spec-cleaner/
    permissions:
      # OIDC token for PyPI Trusted Publishing.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Needed to create the GitHub Release.
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag \
            --title "Release ${GITHUB_REF_NAME#spec-cleaner-}" --generate-notes
